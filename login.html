<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 龟类数据管理系统</title>
<link rel="icon" type="image/jpeg" href="index.jpg">
<link rel="shortcut icon" type="image/jpeg" href="index.jpg">
<script>
(function(){
    var color = localStorage.getItem('turtle_farm_theme_color') || 'blue';
    var mode = localStorage.getItem('turtle_farm_theme');
    if (!mode) mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var root = document.documentElement;
    root.setAttribute('data-theme', color);
    if (mode === 'dark') root.classList.add('dark-mode');
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text-primary:#0f172a;--text-secondary:#334155;--text-tertiary:#94a3b8;--border-light:#e9edf2;--accent:#2563eb;--accent-soft:#eff6ff;--accent-hover:#1d4ed8;--shadow-lg:0 12px 40px rgba(0,0,0,.08);--radius:16px;--radius-sm:10px;--transition:all .25s ease;--navbar-bg:rgba(255,255,255,.85)}
:root[data-theme=purple]{--accent:#8b5cf6;--accent-soft:#f5f3ff;--accent-hover:#7c3aed}
:root[data-theme=green]{--accent:#059669;--accent-soft:#ecfdf5;--accent-hover:#047857}
:root[data-theme=orange]{--accent:#ea580c;--accent-soft:#fff7ed;--accent-hover:#c2410c}
:root[data-theme=pink]{--accent:#db2777;--accent-soft:#fdf2f8;--accent-hover:#be185d}
:root.dark-mode{--bg:#0f172a;--surface:#1e293b;--text-primary:#f1f5f9;--text-secondary:#cbd5e1;--text-tertiary:#94a3b8;--border-light:#334155;--shadow-lg:0 12px 40px rgba(0,0,0,.5);--navbar-bg:rgba(15,23,42,.92)}
:root.dark-mode[data-theme=blue],:root.dark-mode{--accent-soft:#1e3a5f}
:root.dark-mode[data-theme=purple]{--accent-soft:#2e1a5f}
:root.dark-mode[data-theme=green]{--accent-soft:#1a3d2e}
:root.dark-mode[data-theme=orange]{--accent-soft:#3d2210}
:root.dark-mode[data-theme=pink]{--accent-soft:#3d1a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;transition:background .3s ease,color .3s ease;overflow-x:hidden}

.navbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--navbar-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-light);padding:0 40px;height:68px;display:flex;align-items:center;justify-content:space-between;transition:background .3s ease,border-color .3s ease}
.navbar .logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.navbar .logo img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--accent-soft)}
.logo-placeholder{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent)}
.logo-placeholder.show{display:flex}
.logo-text{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px}
.logo-text span{color:var(--accent)}
.back-link{color:var(--text-secondary);text-decoration:none;font-size:14px;font-weight:500;transition:var(--transition);display:flex;align-items:center;gap:6px}
.back-link:hover{color:var(--accent)}
.theme-toggle{background:none;border:none;color:var(--text-tertiary);font-size:16px;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);transition:var(--transition)}
.theme-toggle:hover{background:var(--accent-soft);color:var(--text-primary)}

.auth-card{width:100%;max-width:420px;background:var(--surface);border-radius:var(--radius);padding:36px 32px;border:1px solid var(--border-light);box-shadow:var(--shadow-lg);position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px;justify-content:center}
.auth-logo .brand-logo{width:44px;height:44px;border-radius:12px;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-logo .brand-logo img{width:100%;height:100%;object-fit:cover;display:block}
.auth-logo h1{font-size:18px;font-weight:600;color:var(--text-primary)}
.auth-title{font-size:22px;font-weight:600;text-align:center;margin-bottom:6px;color:var(--text-primary)}
.auth-sub{font-size:13px;color:var(--text-tertiary);text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px}
.form-group input{width:100%;padding:11px 14px;border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:14px;outline:none;font-family:inherit;background:var(--surface);transition:border-color .25s ease,box-shadow .25s ease;color:var(--text-primary)}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.auth-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.auth-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-switch{text-align:center;font-size:13px;color:var(--text-tertiary);margin-top:16px}
.auth-switch a{color:var(--accent);font-weight:500;cursor:pointer;text-decoration:none}
.auth-switch a:hover{text-decoration:underline}
.toast{position:fixed;top:88px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--surface);color:var(--text-primary);padding:12px 22px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);border-left:4px solid #22c55e;opacity:0;visibility:hidden;transition:all .3s ease;z-index:100;max-width:400px}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.error{border-left-color:#ef4444}
@media (max-width:820px){
.navbar{padding:0 16px;height:60px}
.logo-text{font-size:15px}
.auth-card{padding:28px 22px}
.auth-title{font-size:19px}
}
</style>
</head>
<body>

<header class="navbar">
<a href="index.html" class="logo">
<img src="index.jpg" alt="Logo" id="logoImg">
<span class="logo-placeholder" id="logoPlaceholder"><i class="fas fa-folder-open"></i></span>
<span class="logo-text">龟类<span>数据管理</span></span>
</a>
<div style="display:flex;align-items:center;gap:12px">
<button class="theme-toggle" id="themeToggle" title="切换深色模式"><i class="fas fa-moon"></i></button>
<a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回主页</a>
</div>
</header>

<div class="auth-card">
<div class="auth-logo">
<div class="brand-logo"><img src="index.jpg" alt="Logo" onerror="this.style.display='none'"></div>
<h1>龟类数据管理系统</h1>
</div>
<div class="auth-title" id="authTitle">欢迎回来</div>
<div class="auth-sub" id="authSub">登录后即可同步您的养殖数据</div>
<div class="form-group">
<label>邮箱</label>
<input id="authEmail" type="email" placeholder="your@email.com">
</div>
<div class="form-group">
<label>密码</label>
<input id="authPassword" type="password" placeholder="至少 6 位">
</div>
<button class="auth-btn" id="authBtn"><i class="fas fa-right-to-bracket"></i> <span id="authBtnText">登录</span></button>
<div class="auth-switch">
<span id="switchHint">还没有账号？</span>
<a id="switchLink">立即注册</a>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
const SUPABASE_URL = 'http://dl.119899.xyz/https://ftopyijdwqhafgsnycic.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1HGAiuyAI2Qf_vQqxdhfLg_hc_YG2jd';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const THEME_MODE_KEY='turtle_farm_theme';
const themeToggle=document.getElementById('themeToggle');
const toggleIcon=themeToggle.querySelector('i');
function applyThemeMode(mode){
    const isDark=mode==='dark';
    if(isDark){document.documentElement.classList.add('dark-mode');toggleIcon.className='fas fa-sun'}
    else{document.documentElement.classList.remove('dark-mode');toggleIcon.className='fas fa-moon'}
}
let savedMode=localStorage.getItem(THEME_MODE_KEY);
if(!savedMode){savedMode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
applyThemeMode(savedMode);
themeToggle.addEventListener('click',function(){
    const cur=document.documentElement.classList.contains('dark-mode')?'dark':'light';
    const next=cur==='dark'?'light':'dark';
    applyThemeMode(next);
    localStorage.setItem(THEME_MODE_KEY,next);
});
window.addEventListener('storage',function(e){
    if(e.key===THEME_MODE_KEY){applyThemeMode(e.newValue||'light')}
});

const logoImg=document.getElementById('logoImg');
const logoPlaceholder=document.getElementById('logoPlaceholder');
if(logoImg){
    logoImg.addEventListener('error',function(){
        this.style.display='none';
        if(logoPlaceholder) logoPlaceholder.classList.add('show');
    });
}

// URL redirect 参数（只允许纯 .html 文件名，防止钓鱼跳转）
const urlParams=new URLSearchParams(window.location.search);
let redirectTo=urlParams.get('redirect')||'index.html';
if(!/^[a-zA-Z0-9_\-]+\.html$/.test(redirectTo)) redirectTo='index.html';

const toast=document.getElementById('toast');
let toastTimer=null;
function showToast(msg,isError){
    toast.textContent=msg;
    toast.classList.toggle('error',!!isError);
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show')},2600);
}

const authBtn=document.getElementById('authBtn');
const authBtnText=document.getElementById('authBtnText');
const authBtnIcon=authBtn.querySelector('i');
const authTitle=document.getElementById('authTitle');
const authSub=document.getElementById('authSub');
const switchHint=document.getElementById('switchHint');
const switchLink=document.getElementById('switchLink');
const emailInput=document.getElementById('authEmail');
const passwordInput=document.getElementById('authPassword');

let authMode='login';

function setMode(mode){
    authMode=mode;
    if(mode==='login'){
        authTitle.textContent='欢迎回来';
        authSub.textContent='登录后即可同步您的养殖数据';
        authBtnText.textContent='登录';
        authBtnIcon.className='fas fa-right-to-bracket';
        switchHint.textContent='还没有账号？';
        switchLink.textContent='立即注册';
    }else{
        authTitle.textContent='创建账号';
        authSub.textContent='注册后数据将自动保存到云端';
        authBtnText.textContent='注册';
        authBtnIcon.className='fas fa-user-plus';
        switchHint.textContent='已有账号？';
        switchLink.textContent='去登录';
    }
}

switchLink.addEventListener('click',function(){
    setMode(authMode==='login'?'signup':'login');
});

async function submitAuth(){
    const email=emailInput.value.trim();
    const password=passwordInput.value;
    if(!email||!password){showToast('请填写邮箱和密码',true);return}
    if(password.length<6){showToast('密码至少 6 位',true);return}
    authBtn.disabled=true;
    const oldText=authBtnText.textContent;
    authBtnText.textContent='处理中...';
    authBtnIcon.className='fas fa-spinner fa-spin';
    try{
        if(authMode==='login'){
            const {error}=await sb.auth.signInWithPassword({email,password});
            if(error) throw error;
            showToast('登录成功，正在跳转...');
            setTimeout(function(){window.location.href=redirectTo},600);
        }else{
            const {data,error}=await sb.auth.signUp({email,password});
            if(error) throw error;
            if(data.user && !data.session){
                showToast('注册成功，请到邮箱确认后登录');
                setMode('login');
                authBtn.disabled=false;
                authBtnText.textContent='登录';
                authBtnIcon.className='fas fa-right-to-bracket';
                return;
            }else{
                showToast('注册成功，正在跳转...');
                setTimeout(function(){window.location.href=redirectTo},600);
            }
        }
    }catch(e){
        showToast((authMode==='login'?'登录失败：':'注册失败：')+(e.message||''),true);
        authBtn.disabled=false;
        authBtnText.textContent=oldText;
        authBtnIcon.className=authMode==='login'?'fas fa-right-to-bracket':'fas fa-user-plus';
        return;
    }
    authBtn.disabled=false;
}

authBtn.addEventListener('click',submitAuth);
emailInput.addEventListener('keydown',function(e){if(e.key==='Enter')submitAuth()});
passwordInput.addEventListener('keydown',function(e){if(e.key==='Enter')submitAuth()});

(async function(){
    const {data:{session}}=await sb.auth.getSession();
    if(session?.user){
        window.location.href=redirectTo;
    }
})();
})();
</script>

</body>
</html>
