<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号管理 · 龟类数据管理系统</title>
<link rel="icon" type="image/jpeg" href="index.jpg">
<link rel="shortcut icon" type="image/jpeg" href="index.jpg">
<script>
(function(){
    var color = localStorage.getItem('turtle_farm_theme_color') || 'blue';
    var mode = localStorage.getItem('turtle_farm_theme');
    if (!mode) mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var root = document.documentElement;
    root.setAttribute('data-theme', color);
    if (mode === 'dark') root.classList.add('dark-mode');
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text-primary:#0f172a;--text-secondary:#334155;--text-tertiary:#94a3b8;--border-light:#e9edf2;--accent:#2563eb;--accent-soft:#eff6ff;--accent-hover:#1d4ed8;--danger:#ef4444;--danger-soft:#fef2f2;--shadow-md:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 12px 40px rgba(0,0,0,.08);--radius:16px;--radius-sm:10px;--transition:all .25s ease;--navbar-bg:rgba(255,255,255,.85)}
:root[data-theme=purple]{--accent:#8b5cf6;--accent-soft:#f5f3ff;--accent-hover:#7c3aed}
:root[data-theme=green]{--accent:#059669;--accent-soft:#ecfdf5;--accent-hover:#047857}
:root[data-theme=orange]{--accent:#ea580c;--accent-soft:#fff7ed;--accent-hover:#c2410c}
:root[data-theme=pink]{--accent:#db2777;--accent-soft:#fdf2f8;--accent-hover:#be185d}
:root.dark-mode{--bg:#0f172a;--surface:#1e293b;--text-primary:#f1f5f9;--text-secondary:#cbd5e1;--text-tertiary:#94a3b8;--border-light:#334155;--danger-soft:#3b1a1a;--shadow-md:0 4px 16px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.5);--navbar-bg:rgba(15,23,42,.92)}
:root.dark-mode[data-theme=blue],:root.dark-mode{--accent-soft:#1e3a5f}
:root.dark-mode[data-theme=purple]{--accent-soft:#2e1a5f}
:root.dark-mode[data-theme=green]{--accent-soft:#1a3d2e}
:root.dark-mode[data-theme=orange]{--accent-soft:#3d2210}
:root.dark-mode[data-theme=pink]{--accent-soft:#3d1a2e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s ease,color .3s ease;overflow-x:hidden}

.navbar{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--navbar-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-light);padding:0 40px;height:68px;display:flex;align-items:center;justify-content:space-between;transition:background .3s ease,border-color .3s ease}
.navbar .logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.navbar .logo img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--accent-soft)}
.logo-placeholder{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent)}
.logo-placeholder.show{display:flex}
.logo-text{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-.3px}
.logo-text span{color:var(--accent)}
.nav-actions{display:flex;align-items:center;gap:12px}
.back-link{color:var(--text-secondary);text-decoration:none;font-size:14px;font-weight:500;transition:var(--transition);display:flex;align-items:center;gap:6px}
.back-link:hover{color:var(--accent)}
.theme-toggle{background:none;border:none;color:var(--text-tertiary);font-size:16px;cursor:pointer;padding:6px 10px;border-radius:var(--radius-sm);transition:var(--transition)}
.theme-toggle:hover{background:var(--accent-soft);color:var(--text-primary)}

.main{max-width:720px;margin:0 auto;padding:108px 24px 60px}
.page-header{margin-bottom:28px}
.page-title{font-size:26px;font-weight:600;color:var(--text-primary);letter-spacing:-.4px}
.page-subtitle{color:var(--text-tertiary);font-size:13px;margin-top:4px}
.card{background:var(--surface);border-radius:var(--radius);padding:24px 26px;border:1px solid var(--border-light);box-shadow:var(--shadow-md);margin-bottom:20px;transition:background .3s ease,border-color .3s ease}
.card-title{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px}
.card-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:4px;flex-shrink:0}
.card-title i{font-size:14px;color:var(--text-tertiary)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row .label{color:var(--text-tertiary);font-weight:500}
.info-row .value{color:var(--text-primary);font-weight:500}
.info-row .value.mono{font-family:'SF Mono',Consolas,Monaco,monospace;font-size:12px;color:var(--text-secondary);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px}
.form-group input{width:100%;padding:10px 14px;border:1px solid var(--border-light);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit;background:var(--surface);transition:border-color .25s ease,box-shadow .25s ease;color:var(--text-primary)}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.form-hint{font-size:11px;color:var(--text-tertiary);margin-top:5px}
.btn{padding:9px 20px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;font-family:inherit;background:var(--surface);color:var(--text-secondary);border:1px solid var(--border-light)}
.btn i{font-size:12px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn-danger:hover{background:#fee2e2;color:#dc2626}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.btn-full{width:100%;justify-content:center;padding:11px;font-size:14px}

.toast{position:fixed;top:88px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--surface);color:var(--text-primary);padding:12px 22px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);border-left:4px solid #22c55e;opacity:0;visibility:hidden;transition:all .3s ease;z-index:100;max-width:400px}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast.error{border-left-color:#ef4444}

.empty-state{text-align:center;padding:60px 24px;color:var(--text-tertiary)}
.empty-state .icon-wrap{width:64px;height:64px;margin:0 auto 18px;background:var(--accent-soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent)}
.empty-state h2{font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.empty-state p{margin-bottom:20px;font-size:14px}

@media (max-width:820px){
.navbar{padding:0 16px;height:60px}
.logo-text{font-size:15px}
.main{padding:88px 16px 48px}
.page-title{font-size:22px}
.card{padding:18px 18px}
.info-row{flex-direction:column;align-items:flex-start;gap:4px}
.info-row .value.mono{max-width:100%}
}
</style>
</head>
<body>

<header class="navbar">
<a href="index.html" class="logo">
<img src="index.jpg" alt="Logo" id="logoImg">
<span class="logo-placeholder" id="logoPlaceholder"><i class="fas fa-folder-open"></i></span>
<span class="logo-text">龟类<span>数据管理</span></span>
</a>
<div class="nav-actions">
<button class="theme-toggle" id="themeToggle" title="切换深色模式"><i class="fas fa-moon"></i></button>
<a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回主页</a>
</div>
</header>

<div class="main" id="mainContent" style="display:none">
<div class="page-header">
<div class="page-title">账号管理</div>
<div class="page-subtitle">管理您的账号信息和安全设置</div>
</div>

<div class="card">
<div class="card-title"><i class="fas fa-user"></i> 账号信息</div>
<div class="info-row">
<span class="label">邮箱</span>
<span class="value mono" id="infoEmail">—</span>
</div>
<div class="info-row">
<span class="label">注册时间</span>
<span class="value" id="infoCreated">—</span>
</div>
<div class="info-row">
<span class="label">用户 ID</span>
<span class="value mono" id="infoId">—</span>
</div>
</div>

<div class="card">
<div class="card-title"><i class="fas fa-lock"></i> 修改密码</div>
<div class="form-group">
<label>新密码</label>
<input type="password" id="newPassword" placeholder="至少 6 位">
</div>
<div class="form-group">
<label>确认新密码</label>
<input type="password" id="confirmPassword" placeholder="再次输入新密码">
</div>
<div class="form-hint">修改后需使用新密码重新登录。</div>
<button class="btn btn-primary btn-full" style="margin-top:14px" id="changePwdBtn"><i class="fas fa-key"></i> 修改密码</button>
</div>

<div class="card">
<div class="card-title"><i class="fas fa-envelope"></i> 修改邮箱</div>
<div class="form-group">
<label>新邮箱</label>
<input type="email" id="newEmail" placeholder="new@email.com">
</div>
<div class="form-hint">修改后需到新邮箱点击确认链接才会生效。</div>
<button class="btn btn-primary btn-full" style="margin-top:14px" id="changeEmailBtn"><i class="fas fa-paper-plane"></i> 发送确认邮件</button>
</div>

<div class="card">
<div class="card-title" style="color:var(--danger)"><i class="fas fa-right-from-bracket" style="color:var(--danger)"></i> 退出登录</div>
<p style="color:var(--text-secondary);font-size:13px;margin-bottom:14px">退出后需要重新登录才能访问数据。</p>
<button class="btn btn-danger btn-full" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> 退出当前账号</button>
</div>
</div>

<div class="empty-state" id="emptyState">
<div class="icon-wrap"><i class="fas fa-user-slash"></i></div>
<h2>未登录</h2>
<p>请先登录后再访问账号管理</p>
<a href="login.html?redirect=account.html" class="btn btn-primary"><i class="fas fa-right-to-bracket"></i> 去登录</a>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
const SUPABASE_URL = 'https://ftopyijdwqhafgsnycic.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1HGAiuyAI2Qf_vQqxdhfLg_hc_YG2jd';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const THEME_MODE_KEY='turtle_farm_theme';
const themeToggle=document.getElementById('themeToggle');
const toggleIcon=themeToggle.querySelector('i');
function applyThemeMode(mode){
    const isDark=mode==='dark';
    if(isDark){document.documentElement.classList.add('dark-mode');toggleIcon.className='fas fa-sun'}
    else{document.documentElement.classList.remove('dark-mode');toggleIcon.className='fas fa-moon'}
}
let savedMode=localStorage.getItem(THEME_MODE_KEY);
if(!savedMode){savedMode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
applyThemeMode(savedMode);
themeToggle.addEventListener('click',function(){
    const cur=document.documentElement.classList.contains('dark-mode')?'dark':'light';
    const next=cur==='dark'?'light':'dark';
    applyThemeMode(next);
    localStorage.setItem(THEME_MODE_KEY,next);
});
window.addEventListener('storage',function(e){
    if(e.key===THEME_MODE_KEY){applyThemeMode(e.newValue||'light')}
});

const logoImg=document.getElementById('logoImg');
const logoPlaceholder=document.getElementById('logoPlaceholder');
if(logoImg){
    logoImg.addEventListener('error',function(){
        this.style.display='none';
        if(logoPlaceholder) logoPlaceholder.classList.add('show');
    });
}

const toast=document.getElementById('toast');
let toastTimer=null;
function showToast(msg,isError){
    toast.textContent=msg;
    toast.classList.toggle('error',!!isError);
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show')},2800);
}

const mainContent=document.getElementById('mainContent');
const emptyState=document.getElementById('emptyState');

function fmtDate(iso){
    if(!iso) return '—';
    const d=new Date(iso);
    return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function renderUser(user){
    if(!user){
        mainContent.style.display='none';
        emptyState.style.display='block';
        return;
    }
    mainContent.style.display='block';
    emptyState.style.display='none';
    document.getElementById('infoEmail').textContent=user.email||'—';
    document.getElementById('infoCreated').textContent=fmtDate(user.created_at);
    document.getElementById('infoId').textContent=user.id||'—';
}

document.getElementById('changePwdBtn').addEventListener('click',async function(){
    const pwd=document.getElementById('newPassword').value;
    const confirm=document.getElementById('confirmPassword').value;
    if(!pwd||!confirm){showToast('请填写完整密码',true);return}
    if(pwd.length<6){showToast('密码至少 6 位',true);return}
    if(pwd!==confirm){showToast('两次输入的密码不一致',true);return}
    const btn=this;
    btn.disabled=true;
    const old=btn.innerHTML;
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 处理中...';
    try{
        const {error}=await sb.auth.updateUser({password:pwd});
        if(error) throw error;
        showToast('密码已修改，即将重新登录');
        document.getElementById('newPassword').value='';
        document.getElementById('confirmPassword').value='';
        setTimeout(async function(){
            await sb.auth.signOut();
            window.location.href='login.html?redirect=account.html';
        },1500);
    }catch(e){
        showToast('修改失败：'+(e.message||''),true);
        btn.disabled=false;
        btn.innerHTML=old;
    }
});

document.getElementById('changeEmailBtn').addEventListener('click',async function(){
    const email=document.getElementById('newEmail').value.trim();
    if(!email){showToast('请填写新邮箱',true);return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showToast('邮箱格式不正确',true);return}
    const btn=this;
    btn.disabled=true;
    const old=btn.innerHTML;
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 发送中...';
    try{
        const {error}=await sb.auth.updateUser({email});
        if(error) throw error;
        showToast('确认邮件已发送，请到新邮箱查收');
        document.getElementById('newEmail').value='';
        btn.disabled=false;
        btn.innerHTML=old;
    }catch(e){
        showToast('修改失败：'+(e.message||''),true);
        btn.disabled=false;
        btn.innerHTML=old;
    }
});

document.getElementById('logoutBtn').addEventListener('click',async function(){
    await sb.auth.signOut();
    window.location.href='index.html';
});

(async function(){
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user){
        renderUser(null);
        return;
    }
    renderUser(session.user);
    sb.auth.onAuthStateChange(function(event,session){
        renderUser(session?.user||null);
    });
})();
})();
</script>

</body>
</html>
